---
# Inventory for the lab. The single host is the Lima VM; SSH details come from the
# ssh.config that Lima writes, so nothing here needs to change when Lima picks a new port.
all:
  children:
    oracle_db:
      hosts:
        oradb1:
          ansible_host: lima-oracle-ops-lab
          ansible_ssh_common_args: "-F {{ lookup('env', 'HOME') }}/.lima/oracle-ops-lab/ssh.config"
          ansible_python_interpreter: /usr/bin/python3
