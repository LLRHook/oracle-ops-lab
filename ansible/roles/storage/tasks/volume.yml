---
# One disk -> one PV -> one VG -> one LV -> XFS -> mount. Guard rails first: the device
# must exist, be a whole disk, be at least the expected size, carry no partition table
# and carry either no filesystem signature at all or the LVM signature of the VG we own.
# Anything else aborts rather than overwriting it. Size and type come from lsblk; the
# signatures come from `blkid -p`, which probes the device directly instead of reading
# the udev database (lsblk's FSTYPE/PTTYPE are udev-backed and can be empty or stale,
# e.g. for a device udev never probed). blkid -p exits 2 when it finds no signature.
- name: Read device size and type of {{ vol.device }}
  ansible.builtin.command:
    argv: [lsblk, -ndb, -P, -o, "SIZE,TYPE", "{{ vol.device }}"]
  register: storage_dev_info
  changed_when: false

- name: Probe for filesystem and partition-table signatures on {{ vol.device }}
  ansible.builtin.command:
    argv: [blkid, -p, -o, export, "{{ vol.device }}"]
  register: storage_dev_probe
  changed_when: false
  failed_when: storage_dev_probe.rc not in [0, 2]

- name: Parse device facts for {{ vol.device }}
  ansible.builtin.set_fact:
    storage_dev_size_gib: "{{ (storage_dev_info.stdout | regex_search('SIZE=\"([^\"]*)\"', '\\1') | first | int) / 1073741824 }}"
    storage_dev_type: "{{ storage_dev_info.stdout | regex_search('TYPE=\"([^\"]*)\"', '\\1') | first }}"
    storage_dev_fstype: "{{ storage_dev_probe.stdout | regex_search('^TYPE=(.*)$', '\\1', multiline=True) | default([''], true) | first }}"
    storage_dev_pttype: "{{ storage_dev_probe.stdout | regex_search('^PTTYPE=(.*)$', '\\1', multiline=True) | default([''], true) | first }}"

- name: Guard against the wrong disk on {{ vol.device }}
  ansible.builtin.assert:
    that:
      - storage_dev_type == 'disk'
      - storage_dev_size_gib | float >= vol.min_size_gib | float
      - storage_dev_pttype == ''
      - storage_dev_fstype in ['', 'LVM2_member']
    fail_msg: >-
      Refusing to touch {{ vol.device }}: type={{ storage_dev_type }} size={{ storage_dev_size_gib }}GiB
      fstype='{{ storage_dev_fstype }}' pttype='{{ storage_dev_pttype }}'
      (expected a whole blank disk >= {{ vol.min_size_gib }} GiB with no partition table, or our own PV).
    quiet: true

- name: Check that an existing PV belongs to our VG on {{ vol.device }}
  when: storage_dev_fstype == 'LVM2_member'
  block:
    - name: Read owning VG of {{ vol.device }}
      ansible.builtin.command:
        argv: [pvs, --noheadings, -o, vg_name, "{{ vol.device }}"]
      register: storage_pv_vg
      changed_when: false
    - name: Assert VG ownership of {{ vol.device }}
      ansible.builtin.assert:
        that: storage_pv_vg.stdout | trim == vol.vg
        fail_msg: "{{ vol.device }} is a PV of '{{ storage_pv_vg.stdout | trim }}', not {{ vol.vg }}."
        quiet: true

- name: Create volume group {{ vol.vg }}
  community.general.lvg:
    vg: "{{ vol.vg }}"
    pvs: "{{ vol.device }}"
    state: present

- name: Create logical volume using the whole VG {{ vol.lv }}
  community.general.lvol:
    vg: "{{ vol.vg }}"
    lv: "{{ vol.lv }}"
    size: 100%VG
    state: present
    shrink: false

- name: Create XFS filesystem on {{ vol.lv }}
  community.general.filesystem:
    fstype: "{{ storage_fstype }}"
    dev: "/dev/{{ vol.vg }}/{{ vol.lv }}"
    state: present

# Same owner/mode as the post-mount task: once mounted this path is the filesystem
# root, and two tasks disagreeing on its mode would flip it on every run.
- name: Create mount point {{ vol.mount }}
  ansible.builtin.file:
    path: "{{ vol.mount }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"

- name: Mount and persist in fstab {{ vol.mount }}
  ansible.posix.mount:
    path: "{{ vol.mount }}"
    src: "/dev/{{ vol.vg }}/{{ vol.lv }}"
    fstype: "{{ storage_fstype }}"
    opts: "{{ storage_mount_opts }}"
    state: mounted

- name: Hand ownership to the oracle user for {{ vol.mount }}
  ansible.builtin.file:
    path: "{{ vol.mount }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"
