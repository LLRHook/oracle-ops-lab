---
name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: yamllint + ansible-lint (production profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
      - name: Install pinned tooling
        run: uv sync --frozen
      - name: Install pinned collections
        run: cd ansible && ../.venv/bin/ansible-galaxy collection install -r requirements.yml -p collections
      - name: Create a placeholder secrets file (never committed; needed to parse site.yml)
        run: |
          mkdir -p ansible/secrets
          cat > ansible/secrets/secrets.yml <<'EOF'
          ---
          oracle_sys_password: x
          oracle_exporter_password: x
          EOF
      - name: yamllint
        run: .venv/bin/yamllint -s .
      - name: ansible-lint
        run: ANSIBLE_COLLECTIONS_PATH=ansible/collections .venv/bin/ansible-lint --offline

  # promtool runs from the official image via `docker run`, the same way `make test` does.
  # (Running the job inside the busybox-based image breaks actions/checkout, which needs
  # the runner's Node.js and its shared libraries.)
  promtool:
    name: promtool check + unit tests
    runs-on: ubuntu-latest
    env:
      PROMTOOL: >-
        docker run --rm -v ${{ github.workspace }}/monitoring/prometheus:/work:ro -w /work
        --entrypoint promtool prom/prometheus:v3.15.1
    steps:
      - uses: actions/checkout@v5
      - name: Check rules
        run: $PROMTOOL check rules alerts.yml
      - name: Unit tests
        run: $PROMTOOL test rules tests/alerts_test.yml
